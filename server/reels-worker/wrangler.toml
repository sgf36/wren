# Reels per rolling thirty days, per purchase. The safety valve on a one-time
# price for a feature with a per-use cost. Moved here rather than hard-coded so
# that raising it costs a deploy and not a release.
QUOTA_PER_30_DAYS = "250"

# Vertex, which is where the model is actually called.
#
# Not AI Studio: it bills Gemini through a separate prepay payments account
# even when the Cloud billing account behind it is postpay, that account is
# created by a dialog which does not render, and nothing else can fund what it
# never created. Vertex serves the same models through ordinary Cloud billing.
#
# The region is part of the hostname as well as the path, and Vertex prices by
# region, so changing this changes both where the call goes and what it costs.
VERTEX_PROJECT = "gen-lang-client-0475397099"
# `global`, and not by preference: gemini-3.5-flash-lite exists ONLY there.
# europe-west1, europe-west4 and us-central1 all 404 for it while serving 2.5
# quite happily, so a regional endpoint here is a production outage that looks
# like a wrong model name.
VERTEX_LOCATION = "global"

[[d1_databases]]
binding = "DB"
database_name = "wren-reels"
# Created 2026-09-07 in WEUR. The id is not a secret — it names a database that
# only a bound Worker can reach — and it has to be committed, because a deploy
# from CI has nowhere else to read it from.
database_id = "833ae4ac-7d8b-4f8f-a2de-91c3c0ad6789"

[observability]
enabled = true
