name: Screenshots

# Takes the App Store screenshots in a simulator, in the ten most-spoken
# languages, and optionally uploads them.
#
# Deliberately not on push. It boots a simulator and takes around forty minutes,
# and screenshots change far less often than code does. Not a money question --
# this repo is public, so standard runners including macOS are free, and the
# Actions timing API confirms zero billable macOS milliseconds. It is a
# wall-clock question, and a matter of not photographing a build that is about
# to be superseded.
#
#   gh workflow run screenshots.yml                      # take them, keep as an artifact
#   gh workflow run screenshots.yml -f upload=true       # and push to App Store Connect
#   gh workflow run screenshots.yml -f locale=fr-FR      # one language, for a look first
#
# The artifact is the point of the default run: look at the images before any of
# them reaches a public product page. A green job proves the checks ran, not that
# the screenshots are good — those are different claims, and only the second one
# matters here.

on:
  workflow_dispatch:
    inputs:
      locale:
        description: 'One App Store locale (blank = all ten)'
        type: string
        default: ''
      upload:
        description: 'Upload to App Store Connect after taking them'
        type: boolean
        default: false
      maps:
        description: 'Attempt the Apple Maps payoff shot'
        type: boolean
        default: true
      iap:
        description: 'Also take the in-app purchase review images'
        type: boolean
        default: true
      only_iap:
        description: 'Take ONLY the purchase review images (one boot, not forty minutes)'
        type: boolean
        default: false
      verbose:
        description: 'Log every simctl command and its output'
        type: boolean
        default: true

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  shoot:
    name: Take screenshots
    # iOS 26 SDK, and the only runner with a simulator at all.
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # The same guard the suite has: every scene renders in every language it
      # will be shot in, with no overflow. Cheaper to fail here than after
      # forty minutes of simulator work.
      - name: Check every scene renders
        run: flutter test test/scene_render_test.dart --reporter compact

      # PEP 668 on macOS runners refuses installs into the system Python, so a
      # throwaway venv rather than --break-system-packages.
      - name: Python for the image checks
        run: |
          python3 -m venv /tmp/shots
          /tmp/shots/bin/pip install --quiet pillow pyjwt cryptography babel

      # `-u` as well as the script's own line buffering: the run of 17 August
      # 2026 emitted thirty-one minutes of output in a single burst at the end,
      # so there was no watching it and no telling how far it had got.
      - name: Take them
        run: |
          /tmp/shots/bin/python -u store/shoot.py \
            ${{ inputs.locale && format('--locale {0}', inputs.locale) || '' }} \
            ${{ inputs.verbose && '--verbose' || '' }} \
            ${{ !inputs.maps && '--no-maps' || '' }} ${{ !inputs.iap && '--no-iap' || '' }} ${{ inputs.only_iap && '--only-iap' || '' }}  # inverted deliberately: an empty string is FALSY in a GitHub
            # expression, so `inputs.maps && '' || '--no-maps'` falls through
            # to the || branch even when maps is true, and always passed
            # --no-maps. The Apple Maps shot was skipped on every run.

      - name: What came out
        if: always()
        run: |
          find store/screenshots -mindepth 1 -maxdepth 1 -type d -print
          /tmp/shots/bin/python store/push_screenshots.py --check || true

      # On failure the useful question is not "what does the log say" but "what
      # was on the screen". This puts a per-image verdict in the run summary, so
      # a flat frame is visible without downloading anything.
      - name: Measure every frame
        if: always()
        run: |
          /tmp/shots/bin/python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import pathlib
          from PIL import Image
          print('| image | size | most common colour |')
          print('| --- | --- | --- |')
          for p in sorted(pathlib.Path('store/screenshots').rglob('*.png')):
              with Image.open(p) as im:
                  w, h = im.size
                  colours = im.convert('RGB').getcolors(maxcolors=1 << 24) or []
              flat = max((c for c, _ in colours), default=0) / (w * h or 1)
              print(f'| {p.relative_to("store/screenshots")} | {w}x{h} '
                    f'| {flat:.0%} |')
          PY

      # Always, including on failure: a half-finished set is the most useful
      # thing to look at when working out why it failed.
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            store/screenshots/*/APP_IPHONE_67/*.png
            store/screenshots/IAP/*.png
          if-no-files-found: warn

      - name: Upload to App Store Connect
        if: inputs.upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          if [ -z "$ASC_API_KEY_P8_BASE64" ]; then
            echo "::error::upload was asked for but the ASC secrets are absent"
            exit 1
          fi
          mkdir -p /tmp/asc
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > /tmp/asc/key.p8
          # The script reads the key from a fixed path on the author's machine.
          # In CI it comes from a secret, so it is pointed at the decoded copy
          # and the copy is removed on the way out, failure or not.
          trap 'rm -f /tmp/asc/key.p8' EXIT
          export WREN_ASC_KEY=/tmp/asc/key.p8
          export WREN_ASC_KEY_ID="$ASC_KEY_ID"
          export WREN_ASC_ISSUER="$ASC_ISSUER_ID"
          # A run that took only the purchase images has no listing
          # images to push, and pushing what is on disk would upload
          # nothing at all or something stale from the checkout.
          if [ "${{ inputs.only_iap }}" != "true" ]; then
            /tmp/shots/bin/python store/push_screenshots.py --all
          else
            echo "only_iap: skipping the listing screenshots"
          fi
          # The purchases' own review images: a different resource
          # with a different upload, and the thing that keeps a new
          # purchase at MISSING_METADATA. Uploaded in the same run
          # because the images have just been taken and are otherwise
          # only in an artifact nobody will remember to open.
          /tmp/shots/bin/python store/push_iap_screenshot.py --write
