name: Advert creative

# Renders the app's advert beats frame by frame, generates text cards and
# composites a ready-to-publish advert video. The output is one 1080x1920 MP4
# per locale, uploaded as a workflow artifact with a contact sheet beside it.
#
#   gh workflow run advert-creative.yml                          # en-GB
#   gh workflow run advert-creative.yml -f locale=fr-FR          # French
#   gh workflow run advert-creative.yml -f locale=all            # every locale in advert_strings.json
#   gh workflow run advert-creative.yml -f beats="advert-the-list advert-which-city"
#
# No simulator. Until October 2026 the beats were recorded in one with
# `simctl io recordVideo`, and two runs measured frame by frame showed the
# recording could not be trusted (timestamps out of order in a quarter of the
# clips, first-run stalls, a launch screen of 2-33 s). The beats are now drawn
# by test/advert_render_test.dart on the test's fake clock — the same app and
# choreography, every frame exactly where it should be. See store/render.py.
#
# macOS because the render uses Apple's own system fonts (San Francisco,
# Georgia, Hiragino, PingFang, Apple SD Gothic Neo, SF Arabic), found on the
# runner and never committed. This repo is public, so macOS runners are free.
#
# The App Store preview still comes from a real recording — advert-footage.yml —
# because Apple requires previews to be captures of the app itself.

on:
  workflow_dispatch:
    inputs:
      locale:
        description: 'Locale (e.g. en-GB, fr-FR, or "all" for every locale in advert_strings.json)'
        type: string
        default: 'en-GB'
      beats:
        description: 'Beat names, space-separated (blank = every beat)'
        type: string
        default: ''

env:
  FLUTTER_VERSION: '3.44.8'

permissions:
  contents: read

jobs:
  locales:
    name: Resolve locales
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.locales.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve locales
        id: locales
        run: |
          INPUT="${{ inputs.locale || 'en-GB' }}"
          if [ "$INPUT" = "all" ]; then
            MATRIX=$(python3 -c "
          import json
          d = json.load(open('store/advert_strings.json'))
          print(json.dumps(sorted(d.get('problem', {}).keys())))
          ")
          else
            MATRIX=$(python3 -c "import json; print(json.dumps(['$INPUT']))")
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Locales: $MATRIX"

  advert:
    name: ${{ matrix.locale }}
    needs: locales
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      matrix:
        locale: ${{ fromJson(needs.locales.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Install compose dependencies
        run: |
          brew install ffmpeg
          python3 -m venv .venv
          source .venv/bin/activate
          # fonttools: render.py prepares the system fonts and proves every
          # character drawn is in one of them; compose.py refuses tofu the
          # same way on the cards.
          pip install Pillow arabic-reshaper python-bidi fonttools

      - name: Render
        run: |
          source .venv/bin/activate
          BEAT_ARGS=""
          for b in ${{ inputs.beats }}; do BEAT_ARGS="$BEAT_ARGS --beat $b"; done
          python3 -u store/render.py --locale "${{ matrix.locale }}" $BEAT_ARGS

      - name: Compose
        run: |
          source .venv/bin/activate
          COMPOSE_BEATS=""
          if [ -n "${{ inputs.beats }}" ]; then
            COMPOSE_BEATS="--beats ${{ inputs.beats }}"
          fi
          python3 -u store/compose.py --locale "${{ matrix.locale }}" $COMPOSE_BEATS

      - name: Contact sheet
        if: always()
        run: |
          f=$(ls store/adverts/*/wren-advert.mp4 2>/dev/null | head -1)
          if [ -n "$f" ]; then
            # Two frames a second of the finished advert, to look at before
            # downloading it.
            ffmpeg -v error -y -i "$f" -vf "fps=2,scale=120:-1,tile=14x8" \
              -frames:v 1 "store/adverts/contact-sheet.png"
          fi

      - name: Upload advert
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: advert-${{ matrix.locale }}
          path: |
            store/adverts/**/*.mp4
            store/adverts/contact-sheet.png
            store/render/*/manifest.json
          if-no-files-found: warn
