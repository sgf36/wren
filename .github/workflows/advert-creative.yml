name: Advert creative

# Records app footage in a simulator, generates text cards and composites a
# ready-to-publish advert video. The output is one 1080x1920 MP4 per locale,
# uploaded as a workflow artifact.
#
#   gh workflow run advert-creative.yml                          # en-GB
#   gh workflow run advert-creative.yml -f locale=fr-FR          # French
#   gh workflow run advert-creative.yml -f locale=all            # every locale in advert_strings.json
#   gh workflow run advert-creative.yml -f beats="advert-the-list advert-which-city"
#
# This repo is public, so macOS runners are free.
#
# locale=all fans out into a matrix: each locale records and composes on its
# own runner in parallel, after a single shared Flutter build. The Runner.app
# is tarred before upload to preserve iOS bundle symlinks.

on:
  workflow_dispatch:
    inputs:
      locale:
        description: 'Locale (e.g. en-GB, fr-FR, or "all" for every locale in advert_strings.json)'
        type: string
        default: 'en-GB'
      beats:
        description: 'Beat names, space-separated (blank = default beats)'
        type: string
        default: ''
      verbose:
        description: 'Log every command and its output'
        type: boolean
        default: true

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  build:
    name: Build app
    runs-on: macos-26
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.locales.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Check every scene renders
        run: flutter test test/scene_render_test.dart --reporter compact

      - name: Check the beats can be performed
        run: flutter test test/advert_choreography_test.dart --reporter compact

      - name: Build the app
        run: flutter build ios --simulator --debug --dart-define=WREN_SHOTS=true

      - name: Resolve locales
        id: locales
        run: |
          INPUT="${{ inputs.locale || 'en-GB' }}"
          if [ "$INPUT" = "all" ]; then
            MATRIX=$(python3 -c "
          import json
          d = json.load(open('store/advert_strings.json'))
          print(json.dumps(sorted(d.get('problem', {}).keys())))
          ")
          else
            MATRIX=$(python3 -c "import json; print(json.dumps(['$INPUT']))")
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Locales: $MATRIX"

      - name: Package the built app
        run: tar -czf runner-app.tar.gz -C build/ios/iphonesimulator Runner.app

      - name: Share the built app
        uses: actions/upload-artifact@v7
        with:
          name: runner-app
          path: runner-app.tar.gz
          retention-days: 1

  advert:
    name: ${{ matrix.locale }}
    needs: build
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      matrix:
        locale: ${{ fromJson(needs.build.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v7

      - name: Download built app
        uses: actions/download-artifact@v4
        with:
          name: runner-app

      - name: Unpack the built app
        run: |
          mkdir -p build/ios/iphonesimulator
          tar -xzf runner-app.tar.gz -C build/ios/iphonesimulator
          echo "Runner.app unpacked at:"
          ls -ld build/ios/iphonesimulator/Runner.app

      - name: Install compose dependencies
        run: |
          brew install ffmpeg
          python3 -m venv .venv
          source .venv/bin/activate
          # fonttools: compose.py reads each font's cmap to refuse tofu.
          pip install Pillow arabic-reshaper python-bidi fonttools

      - name: Record
        run: |
          BEATS="${{ inputs.beats }}"
          BEAT_ARGS=""
          if [ -n "$BEATS" ]; then
            for b in $BEATS; do
              BEAT_ARGS="$BEAT_ARGS --beat $b"
            done
          fi

          python3 -u store/record.py \
            --keep-build \
            $BEAT_ARGS \
            --locale "${{ matrix.locale }}" \
            ${{ inputs.verbose && '--verbose' || '' }}

      - name: Compose
        run: |
          source .venv/bin/activate

          BEATS="${{ inputs.beats }}"
          COMPOSE_BEATS=""
          if [ -n "$BEATS" ]; then
            COMPOSE_BEATS="--beats $BEATS"
          fi

          python3 -u store/compose.py \
            --locale "${{ matrix.locale }}" \
            $COMPOSE_BEATS

      - name: Clip report
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import pathlib
          adverts = pathlib.Path("store/adverts")
          if not adverts.exists():
              print("No adverts produced.")
          else:
              print("| locale | file | size |")
              print("| --- | --- | --- |")
              for f in sorted(adverts.rglob("*.mp4")):
                  locale = f.parent.name
                  size = f.stat().st_size / 1e6
                  print(f"| {locale} | {f.name} | {size:.1f} MB |")
          print()

          footage = pathlib.Path("store/footage")
          if footage.exists():
              import sys
              sys.path.insert(0, "store")
              from record import probe
              print("| beat clip | seconds | frames | peak fps | size |")
              print("| --- | --- | --- | --- | --- |")
              for f in sorted(footage.rglob("*.mov")):
                  secs, frames, ok, peak = probe(f)
                  flag = "" if ok else " **NOT FINALISED**"
                  print(f"| {f.relative_to(footage)}{flag} | {secs:.1f} "
                        f"| {frames} | {peak:.0f} | {f.stat().st_size / 1e6:.1f} MB |")
          PY

      - name: Upload advert
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: advert-${{ matrix.locale }}
          path: store/adverts/**/*.mp4
          if-no-files-found: warn

      - name: Upload raw footage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: footage-${{ matrix.locale }}
          path: store/footage/**/*.mov
          if-no-files-found: warn
